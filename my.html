<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentines Althea</title>
    <link href="https://fonts.googleapis.com/css2?family=Adarah&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: url('https://ik.imagekit.io/yourware/prod/4840adf9-ee89-45cd-a0e2-b6cd483fb9e7/screenshot_0c12.png?tr=w-800,ar-16-9,fo-top,q-75,f-webp') center/cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Adarah', cursive;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 0;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* Hearts Container */
        .hearts-container {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            animation: heartsSwing 3s ease-in-out infinite;
            transform-origin: center top;
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        @keyframes heartsSwing {
            0%, 100% {
                transform: translateX(-50%) rotateZ(-8deg);
            }
            50% {
                transform: translateX(-50%) rotateZ(8deg);
            }
        }

        /* Individual Heart */
        .heart-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heartBounce 2s ease-in-out infinite;
        }

        .heart-item:nth-child(1) {
            animation-delay: 0s;
        }

        .heart-item:nth-child(2) {
            animation-delay: 0.2s;
        }

        .heart-item:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes heartBounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }

        /* Heart Shape */
        .heart-shape {
            width: 80px;
            height: 80px;
            position: relative;
            animation: heartPulse 1.5s ease-in-out infinite;
        }

        @keyframes heartPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        /* Create heart with CSS */
        .heart-shape::before,
        .heart-shape::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 65px;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            border-radius: 40px 40px 0 0;
            top: 0;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.8), inset -2px -2px 5px rgba(255, 105, 180, 0.5);
        }

        .heart-shape::before {
            left: 0;
            transform: rotate(-45deg);
            transform-origin: 40px 40px;
        }

        .heart-shape::after {
            right: 0;
            transform: rotate(45deg);
            transform-origin: 0 40px;
        }

        /* Stem */
        .heart-stem {
            width: 3px;
            height: 60px;
            background: linear-gradient(to bottom, #2d5016, #3d6b1f);
            margin-top: 5px;
            border-radius: 2px;
            position: relative;
            animation: stemWave 3s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes stemWave {
            0%, 100% {
                transform: rotateZ(-2deg);
            }
            50% {
                transform: rotateZ(2deg);
            }
        }

        /* Leaves */
        .leaf {
            position: absolute;
            width: 20px;
            height: 30px;
            background: linear-gradient(135deg, #2d5016, #4a7c2f);
            border-radius: 50% 0 0 50%;
        }

        .leaf.left {
            left: -8px;
            top: 25px;
            transform: rotate(-25deg);
            animation: leafWave 3s ease-in-out infinite;
        }

        .leaf.right {
            right: -8px;
            top: 35px;
            transform: rotate(25deg) scaleX(-1);
            animation: leafWave 3s ease-in-out infinite 0.2s;
        }

        @keyframes leafWave {
            0%, 100% {
                transform: rotate(-25deg) translateX(-2px);
            }
            50% {
                transform: rotate(-25deg) translateX(2px);
            }
        }

        /* Rising Flowers Container */
        .rising-flowers-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
            pointer-events: none;
        }

        /* Rising Flowers */
        .rising-flowers {
            display: flex;
            gap: 60px;
            animation: riseUp 6s ease-in-out infinite;
            padding-bottom: 220px;
        }

        @keyframes riseUp {
            0% {
                transform: translateY(300px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(0);
                opacity: 0;
            }
        }

        /* Individual Rising Flower */
        .rising-flower {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: flowerSway 2s ease-in-out infinite;
        }

        .rising-flower:nth-child(1) {
            animation-delay: 0s;
        }

        .rising-flower:nth-child(2) {
            animation-delay: 0.3s;
        }

        .rising-flower:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes flowerSway {
            0%, 100% {
                transform: translateX(-15px);
            }
            50% {
                transform: translateX(15px);
            }
        }

        /* Rose Bloom */
        .rose-bloom {
            width: 90px;
            height: 90px;
            position: relative;
            animation: roseBloom 3s ease-in-out infinite;
        }

        @keyframes roseBloom {
            0%, 100% {
                transform: scale(0.95);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* Rose Petals - Layered effect */
        .rose-petal {
            position: absolute;
            border-radius: 50% 50% 50% 0;
            transform-origin: center bottom;
        }

        /* Outer petals (light pink) */
        .petal-outer-1 {
            width: 35px;
            height: 50px;
            background: linear-gradient(135deg, #ffb3d0, #ffc0d9);
            top: 15px;
            left: 27px;
            transform: rotate(0deg);
            box-shadow: 0 2px 8px rgba(255, 105, 180, 0.4);
        }

        .petal-outer-2 {
            width: 35px;
            height: 50px;
            background: linear-gradient(135deg, #ffb3d0, #ffc0d9);
            top: 15px;
            left: 27px;
            transform: rotate(72deg);
            box-shadow: 0 2px 8px rgba(255, 105, 180, 0.4);
        }

        .petal-outer-3 {
            width: 35px;
            height: 50px;
            background: linear-gradient(135deg, #ffb3d0, #ffc0d9);
            top: 15px;
            left: 27px;
            transform: rotate(144deg);
            box-shadow: 0 2px 8px rgba(255, 105, 180, 0.4);
        }

        .petal-outer-4 {
            width: 35px;
            height: 50px;
            background: linear-gradient(135deg, #ffb3d0, #ffc0d9);
            top: 15px;
            left: 27px;
            transform: rotate(216deg);
            box-shadow: 0 2px 8px rgba(255, 105, 180, 0.4);
        }

        .petal-outer-5 {
            width: 35px;
            height: 50px;
            background: linear-gradient(135deg, #ffb3d0, #ffc0d9);
            top: 15px;
            left: 27px;
            transform: rotate(288deg);
            box-shadow: 0 2px 8px rgba(255, 105, 180, 0.4);
        }

        /* Middle petals (medium pink) */
        .petal-mid-1 {
            width: 32px;
            height: 45px;
            background: linear-gradient(135deg, #ff69b4, #ffb3d0);
            top: 22px;
            left: 29px;
            transform: rotate(36deg);
            box-shadow: 0 2px 10px rgba(255, 20, 147, 0.5);
        }

        .petal-mid-2 {
            width: 32px;
            height: 45px;
            background: linear-gradient(135deg, #ff69b4, #ffb3d0);
            top: 22px;
            left: 29px;
            transform: rotate(108deg);
            box-shadow: 0 2px 10px rgba(255, 20, 147, 0.5);
        }

        .petal-mid-3 {
            width: 32px;
            height: 45px;
            background: linear-gradient(135deg, #ff69b4, #ffb3d0);
            top: 22px;
            left: 29px;
            transform: rotate(180deg);
            box-shadow: 0 2px 10px rgba(255, 20, 147, 0.5);
        }

        .petal-mid-4 {
            width: 32px;
            height: 45px;
            background: linear-gradient(135deg, #ff69b4, #ffb3d0);
            top: 22px;
            left: 29px;
            transform: rotate(252deg);
            box-shadow: 0 2px 10px rgba(255, 20, 147, 0.5);
        }

        .petal-mid-5 {
            width: 32px;
            height: 45px;
            background: linear-gradient(135deg, #ff69b4, #ffb3d0);
            top: 22px;
            left: 29px;
            transform: rotate(324deg);
            box-shadow: 0 2px 10px rgba(255, 20, 147, 0.5);
        }

        /* Inner petals (deep pink) */
        .petal-inner-1 {
            width: 28px;
            height: 38px;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            top: 28px;
            left: 31px;
            transform: rotate(18deg);
            box-shadow: 0 2px 12px rgba(255, 20, 147, 0.7);
        }

        .petal-inner-2 {
            width: 28px;
            height: 38px;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            top: 28px;
            left: 31px;
            transform: rotate(90deg);
            box-shadow: 0 2px 12px rgba(255, 20, 147, 0.7);
        }

        .petal-inner-3 {
            width: 28px;
            height: 38px;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            top: 28px;
            left: 31px;
            transform: rotate(162deg);
            box-shadow: 0 2px 12px rgba(255, 20, 147, 0.7);
        }

        .petal-inner-4 {
            width: 28px;
            height: 38px;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            top: 28px;
            left: 31px;
            transform: rotate(234deg);
            box-shadow: 0 2px 12px rgba(255, 20, 147, 0.7);
        }

        .petal-inner-5 {
            width: 28px;
            height: 38px;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            top: 28px;
            left: 31px;
            transform: rotate(306deg);
            box-shadow: 0 2px 12px rgba(255, 20, 147, 0.7);
        }

        /* Center bud */
        .rose-center {
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 35% 35%, #c1006f, #8b0050);
            border-radius: 50%;
            position: absolute;
            top: 34px;
            left: 34px;
            box-shadow: 0 0 10px rgba(193, 0, 111, 0.8), inset 0 0 5px rgba(139, 0, 80, 0.6);
        }

        /* Rising Stem */
        .rising-stem {
            width: 4px;
            height: 85px;
            background: linear-gradient(to bottom, #3d6b1f, #2d5016);
            margin-top: 2px;
            border-radius: 2px;
            position: relative;
            animation: risingStemWave 2s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes risingStemWave {
            0%, 100% {
                transform: rotateZ(-1.5deg);
            }
            50% {
                transform: rotateZ(1.5deg);
            }
        }

        /* Rising Leaves */
        .rising-leaf {
            position: absolute;
            width: 20px;
            height: 32px;
            background: linear-gradient(135deg, #2d5016, #4a7c2f);
            border-radius: 50% 0 0 50%;
            box-shadow: 0 2px 4px rgba(45, 80, 22, 0.5);
        }

        .rising-leaf.left {
            left: -10px;
            top: 35px;
            transform: rotate(-30deg);
            animation: risingLeafWave 2s ease-in-out infinite;
        }

        .rising-leaf.right {
            right: -10px;
            top: 45px;
            transform: rotate(30deg) scaleX(-1);
            animation: risingLeafWave 2s ease-in-out infinite 0.15s;
        }

        @keyframes risingLeafWave {
            0%, 100% {
                transform: rotate(-30deg) translateX(-2px);
            }
            50% {
                transform: rotate(-30deg) translateX(2px);
            }
        }

        /* Floating Hearts Animation */
        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) scale(1);
                opacity: 0.8;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) scale(0);
                opacity: 0;
            }
        }

        .floating-heart {
            position: absolute;
            color: #ff1493;
            font-size: 2rem;
            animation: float 8s infinite ease-in;
            text-shadow: 0 0 15px rgba(255, 20, 147, 0.9), 0 0 30px rgba(255, 105, 180, 0.8);
            filter: drop-shadow(0 0 5px rgba(255, 105, 180, 0.6));
        }

        .floating-heart:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 8s; }
        .floating-heart:nth-child(2) { left: 20%; animation-delay: 1s; animation-duration: 7s; }
        .floating-heart:nth-child(3) { left: 30%; animation-delay: 2s; animation-duration: 9s; }
        .floating-heart:nth-child(4) { left: 40%; animation-delay: 0.5s; animation-duration: 8s; }
        .floating-heart:nth-child(5) { left: 50%; animation-delay: 1.5s; animation-duration: 7.5s; }
        .floating-heart:nth-child(6) { left: 60%; animation-delay: 2.5s; animation-duration: 8.5s; }
        .floating-heart:nth-child(7) { left: 70%; animation-delay: 0.8s; animation-duration: 7s; }
        .floating-heart:nth-child(8) { left: 80%; animation-delay: 1.8s; animation-duration: 9s; }
        .floating-heart:nth-child(9) { left: 90%; animation-delay: 0.3s; animation-duration: 8s; }

        /* Floating Particles */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        .particle.sparkle {
            font-size: 1.2rem;
            animation: sparkleFloat 6s infinite ease-in;
        }

        @keyframes sparkleFloat {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px) scale(0);
                opacity: 0;
            }
        }

        .particle.sparkle:nth-child(10) { left: 15%; animation-delay: 0s; }
        .particle.sparkle:nth-child(11) { left: 25%; animation-delay: 1s; }
        .particle.sparkle:nth-child(12) { left: 35%; animation-delay: 2s; }
        .particle.sparkle:nth-child(13) { left: 65%; animation-delay: 0.5s; }
        .particle.sparkle:nth-child(14) { left: 75%; animation-delay: 1.5s; }
        .particle.sparkle:nth-child(15) { left: 85%; animation-delay: 2.5s; }

        /* Message Text */
        .message {
            position: absolute;
            bottom: 150px;
            text-align: center;
            color: #ffffff;
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255, 20, 147, 1), 0 0 60px rgba(255, 105, 180, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
            z-index: 3;
            animation: messageGlow 2s ease-in-out infinite, messageFloat 3s ease-in-out infinite;
        }

        .message .heart-emoji {
            font-size: 3rem;
            animation: heartBeat 1s ease-in-out infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes messageGlow {
            0%, 100% {
                text-shadow: 0 0 30px rgba(255, 20, 147, 1), 0 0 60px rgba(255, 105, 180, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.8);
            }
            50% {
                text-shadow: 0 0 40px rgba(255, 20, 147, 1), 0 0 80px rgba(255, 105, 180, 1), 2px 2px 4px rgba(0, 0, 0, 0.8);
            }
        }

        @keyframes messageFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hearts-container {
                top: 50px;
                gap: 20px;
            }

            .message {
                font-size: 2.5rem;
                bottom: 100px;
            }

            .message .heart-emoji {
                font-size: 2rem;
            }

            .heart-shape {
                width: 60px;
                height: 60px;
            }

            .heart-shape::before,
            .heart-shape::after {
                width: 30px;
                height: 50px;
            }

            .rising-flowers {
                gap: 40px;
                padding-bottom: 180px;
            }

            .rose-bloom {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
